# Publishes docs/wiki to the repository's GitHub wiki whenever it changes on
# v2 (scripts/publish-wiki.sh rewrites the links for it). docs/wiki is the
# source: edits made in the wiki's web editor are overwritten.
#
# The wiki's git repository exists only once its first page has been created
# in the web interface; until then this fails at the clone.
name: wiki

on:
  push:
    branches: [v2]
    paths: ["docs/wiki/**", "scripts/publish-wiki.sh"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
      - name: Write the pages
        run: scripts/publish-wiki.sh wiki "https://github.com/${GITHUB_REPOSITORY}" v2
      - name: Push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "the wiki is up to date"
            exit 0
          fi
          git commit -m "docs/wiki at ${GITHUB_SHA::7}"
          git push
