syntax = "proto3";

package wuphf.connector.v1;

option go_package = "github.com/wuphf-rs/wuphf-ai/proto/go/connector/v1;wuphfpb";

import "common.proto";

// Raw origin coordinates for an inbound message. The connector id is taken from
// the session registration, not the wire, so a session cannot speak for another
// connector. The core resolves (connector, chat_id, thread_id) to an endpoint.
message MessageCreateEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  optional string chat_title = 3;
  string platform_message_id = 4;
  string sender = 5;
  optional string participant = 6;
  optional string text = 7;
  repeated Attachment attachments = 8;
  optional string reply_to_platform_message_id = 9;
  int64 timestamp_ms = 10;
  optional string sender_name = 11;
  // The chat's timer as this message carried it (WhatsApp: the message's
  // ContextInfo.expiration, on the owner's own messages too). Set only when the
  // message carries one greater than 0. A message without one never turns a
  // known timer off; when the chat's timer is unknown and the connector
  // declares supports_disappearing_timers, the core records it as off.
  optional DisappearingTimer disappearing = 12;
  // The sender as the connector's owner_ids name accounts, when that differs
  // from `sender` (a Telegram user's plain id, where `sender` is
  // telegram:user:N). The core checks it against owner_ids, for instance to
  // turn the owner's lone-emoji reply into a reaction (plan 081).
  optional string sender_account = 13;
  // The chat the quoted message lives in, when it is not this message's
  // own chat (a Telegram reply to a message in another chat, plan 083). A
  // quote of another thread of the same chat names no chat: the core looks
  // for it on every thread of this chat.
  optional string reply_to_chat_id = 14;
}

// One chat's properties as the platform reported them. An absent field was not
// reported and leaves what the core knows unchanged.
message ChatUpdate {
  string chat_id = 1;
  optional DisappearingTimer disappearing = 2;
  // The chat's display title, exactly as the connector sends it in
  // MessageCreateEvent.chat_title (tags included). A change renames the
  // mirror thread; it never becomes a note.
  optional string title = 3;
  // The group description / chat about text. Empty means cleared.
  optional string description = 4;
  optional ChatAvatar avatar = 5;
  // The member count, when the connector read it (group info, a snapshot).
  optional uint32 participant_count = 6;
  // Membership events, in order. Never part of a snapshot.
  repeated ParticipantChange participant_changes = 7;
  // Set when the update is about a thread (a Telegram forum topic) rather
  // than the whole chat. The core resolves (chat_id, thread_id) to the
  // conversation's mirror endpoint.
  optional string thread_id = 8;
  optional bool pinned = 9;
  optional MuteState mute = 10;
  // WhatsApp: archived. Telegram topic: closed.
  optional bool archived = 11;
  // What this account may do in the chat (plan 083). Absent: unknown, open.
  optional ChatPosting posting = 12;
}

// What an account may do in a chat. The core refuses to send messages (and
// edits) into a chat that takes none, and reactions into one that takes
// none, and tells the sender why.
message ChatPosting {
  // The account may post new messages (WhatsApp: not into status@broadcast,
  // an admin-only group as a member, a channel it does not own or admin).
  bool messages = 1;
  // The account may react to messages.
  bool reactions = 2;
  // A message here may be quoted only in a reply to its author's direct
  // chat (a story).
  bool private_replies = 3;
  // The account may post here on purpose (plan 084): a story to its
  // contacts, a channel post to its followers. Only an explicit post
  // (MessageCreateDispatch.post) goes there.
  bool posts = 4;
  // Who sees a post, as the platform's setting says ("My contacts", "My
  // contacts except 3"), when known.
  optional string audience = 5;
  // An edit of a message already posted there goes through (plan 085: a
  // channel post). Off for a story: WhatsApp cannot edit one.
  bool post_edits = 6;
}

// The chat's picture. `id` is the platform's picture id; empty means the
// picture was removed. `media_id` is the uploaded picture in the core's media
// store, absent when removed or when the connector could not fetch it.
message ChatAvatar {
  string id = 1;
  optional string media_id = 2;
}

message ParticipantChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_JOINED = 1;
    KIND_LEFT = 2;
    KIND_PROMOTED = 3;
    KIND_DEMOTED = 4;
  }
  Kind kind = 1;
  // Canonical participant id, as the connector reports senders.
  string participant = 2;
  // Display name as the connector resolves senders (contact name first).
  optional string name = 3;
  // Who made the change (the admin who added, removed, promoted or demoted
  // the member), when the platform says: canonical id in the same address
  // form as `participant`, and display name resolved like `name`. Absent for
  // a self-join through a link or a self-leave the platform reports without
  // an actor. The core uses the plain wording when it is absent or equals
  // `participant`.
  optional string actor = 4;
  optional string actor_name = 5;
}

// Chat properties changed or were learned (a timer setting message, a group
// notification, a history sync). A batch, since a history sync reports
// hundreds of chats at once. `chat_id`s are canonical, exactly as the
// connector reports them in MessageCreateEvent.
message ChatUpdateEvent {
  repeated ChatUpdate updates = 1;
  // The updates describe current state (a history sync, a first sighting),
  // not live changes: the core stores them without notes.
  bool snapshot = 2;
}

// The platform reported that an existing message's content changed. The
// connector reports the original message's native id and the new text; the core
// resolves it to the logical message and fans the edit out to the other copies.
message MessageEditEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  optional string text = 4;
}

// The platform reported that an existing message was deleted/revoked. The
// connector reports the original message's native id; the core resolves it to
// the logical message and fans the deletion out to the other copies.
message MessageDeleteEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
}

// The platform reported a chat address change (e.g. WhatsApp phone-to-LID).
// Both addresses remain resolvable; the new one becomes canonical for outbound.
message IdentityMigrated {
  string old_chat_id = 1;
  optional string old_thread_id = 2;
  string new_chat_id = 3;
  optional string new_thread_id = 4;
}

message Acknowledgement {
  string dispatch_id = 1;
  string platform_message_id = 2;
  // The thread/topic the message landed in. Set when the dispatch provisioned a
  // new thread, so the core can persist the conversation thread mapping.
  optional string thread_id = 3;
}

// A dispatch that can never succeed (e.g. an invalid target peer). The
// connector reports it instead of acknowledging so the core dead-letters the
// dispatch rather than redelivering it forever. Transient failures are not
// reported this way; the connector drops its session and the core redelivers.
message DispatchFailed {
  string dispatch_id = 1;
  string reason = 2;
}

// The platform reported a reaction change on a message. Reactions are toggles:
// `emoji` empty means the reactor cleared their reaction. The connector reports
// the reacted message's native id (resolved to the logical message like an
// edit) and the reactor. `from_me` marks a reaction by the connector's own
// session account, which the core counts as the owner's: report it only where
// that account is the owner's (WhatsApp, Instagram), and drop the bridge's
// own reactions elsewhere (Telegram's 👍/👀 signals). The core stores each
// reactor's last reaction per copy, so a repeated or echoed one is ignored.
message ReactionEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  string sender = 4;
  optional string sender_name = 5;
  string emoji = 6;
  bool from_me = 7;
}

// The complete set of reactions other accounts have on a message, for a
// platform that reports a message's reactions as a whole rather than one
// reactor's change (a Telegram user session). A reactor absent from the set
// has none: the core compares the set with the reactions it stored for this
// copy and turns each difference into a toggle. The connector's own account is
// left out, as for `ReactionEvent`; each reactor appears at most once, with
// their newest reaction.
message ReactionsEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  repeated ReactorReaction reactions = 4;
}

// One reactor's reaction in a `ReactionsEvent`.
message ReactorReaction {
  string sender = 1;
  optional string sender_name = 2;
  string emoji = 3;
}

// Whether a receipt reports the message reached the peer's device (delivered) or
// was opened by the peer (read).
enum ReceiptKind {
  RECEIPT_KIND_UNSPECIFIED = 0;
  RECEIPT_KIND_DELIVERED = 1;
  RECEIPT_KIND_READ = 2;
}

// The platform reported a delivery or read receipt for a message. Surfaced on
// the message's other copies: a 👍 reaction for delivered, a 👀 reaction for
// read (DMs only). This works for messages the bridge sent and for messages the
// account owner sent from another of the platform's devices, since the peer's
// receipt names the message either way. The connector reports the message's
// native id; the core resolves it to the logical message and fans the signal to
// the non-observer endpoints. `observer` is the peer that delivered/read it;
// `from_me` flags the owner's own receipt (e.g. a read on another device), which
// the core ignores.
message ReceiptEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  string observer = 4;
  bool from_me = 5;
  ReceiptKind kind = 6;
}


// How badly a connector's own operation is affected. The core picks the
// wording from this, so a connector reports what happened rather than how it
// should read.
enum NoticeKind {
  NOTICE_KIND_UNSPECIFIED = 0;
  // The platform ended the session; it cannot recover without the owner
  // re-authenticating (a WhatsApp logout, a revoked pairing).
  NOTICE_KIND_LOGGED_OUT = 1;
  // Credentials were rejected or expired, and the connector needs new ones.
  NOTICE_KIND_AUTH_REQUIRED = 2;
  // Still running, but impaired — rate limited, temporarily banned, or
  // otherwise degraded.
  NOTICE_KIND_DEGRADED = 3;
  // Back to normal after one of the above.
  NOTICE_KIND_RECOVERED = 4;
  // Not about the connector's health: a message went to a chat whose
  // disappearing-messages timer the connector could not learn, so it was sent
  // without one and will not disappear. `detail` names the chat. The core does
  // not fold it into the connector's health state.
  NOTICE_KIND_DISAPPEARING_TIMER_UNKNOWN = 5;
  // Not about the connector's health: an inbound message's media could not be
  // downloaded, so the message was not bridged. `detail` names the media kind,
  // the sender, the chat and the error. The core does not fold it into the
  // connector's health state.
  NOTICE_KIND_MEDIA_UNAVAILABLE = 6;
  // Not about the connector's health: the connector is waiting to be linked to
  // its account again (a WhatsApp pairing after a logout). `detail` says how
  // (scan the attached QR code, or enter a pair code it names) and for how
  // long; `media_ids` may carry the QR code. The core does not fold it into the
  // connector's health state; the connector limits repeats.
  NOTICE_KIND_LINK_REQUIRED = 7;
}

// A connector reporting its own operational state to the account owner. A
// connector that loses its session goes quiet, and a bridge that has quietly
// stopped bridging is worse than one that says so: the core turns this into a
// message delivered through the *other* connectors, which are still working.
//
// The connector reports only what happened. Where the notice goes, how it is
// worded, and whether a repeat is worth sending are all core decisions.
message OwnerNotice {
  NoticeKind kind = 1;
  // Platform-supplied specifics, if any (a ban expiry, a failure reason).
  // Appended to the core's wording; safe to leave empty.
  string detail = 2;
  // Media the connector uploaded to the core's media store, shown with the
  // notice (a QR code to scan). An id the store does not hold is dropped; the
  // text still goes out.
  repeated string media_ids = 3;
}
message ClientFrame {
  oneof body {
    Registration registration = 1;
    MessageCreateEvent message_create = 2;
    Acknowledgement acknowledgement = 3;
    IdentityMigrated identity_migrated = 4;
    DispatchFailed dispatch_failed = 5;
    MessageEditEvent message_edit = 6;
    MessageDeleteEvent message_delete = 7;
    ReactionEvent reaction = 8;
    ReceiptEvent receipt = 9;
    OwnerNotice owner_notice = 10;
    ChatUpdateEvent chat_update = 11;
    CommandResult command_result = 12;
    ProbeResult probe_result = 13;
    ReactionsEvent reactions_set = 14;
  }
}

// The answer to a ProbeChats: one ChatFacts per chat asked about, and the
// connector's tools as they are now.
message ProbeResult {
  string request_id = 1;
  repeated ChatFacts chats = 2;
  repeated ToolStatus tools = 3;
}

// What this account can do in one chat. The core decides what a rule needs.
message ChatFacts {
  string chat_id = 1;
  // The chat exists and this account can see it.
  Fact exists = 2;
  // This account is in it.
  Fact member = 3;
  // This account may post in it (not an admin-only group it does not admin).
  Fact can_send = 4;
  // It has topics (a Telegram forum).
  Fact forum = 5;
  // This account may create topics in it.
  Fact can_create_topics = 6;
  // This account may pin messages in it.
  Fact can_pin = 7;
  // This account may delete other people's messages in it.
  Fact can_delete_others = 8;
  // The platform's own words when a fact is FACT_NO or a lookup failed, for
  // the owner's notice.
  string detail = 9;
}

enum Fact {
  FACT_UNKNOWN = 0;
  FACT_YES = 1;
  FACT_NO = 2;
}

// The answer to a RunCommand: `message` is shown to the owner (as an error
// when not `ok`, e.g. an unknown command).
message CommandResult {
  string request_id = 1;
  bool ok = 2;
  string message = 3;
}
