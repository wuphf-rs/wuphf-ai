syntax = "proto3";

package wuphf.connector.v1;

option go_package = "github.com/akshettrj/wuphf/proto/go/connector/v1;wuphfpb";

import "common.proto";

// Raw origin coordinates for an inbound message. The connector id is taken from
// the session registration, not the wire, so a session cannot speak for another
// connector. The core resolves (connector, chat_id, thread_id) to an endpoint.
message MessageCreateEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  optional string chat_title = 3;
  string platform_message_id = 4;
  string sender = 5;
  optional string participant = 6;
  optional string text = 7;
  repeated Attachment attachments = 8;
  optional string reply_to_platform_message_id = 9;
  int64 timestamp_ms = 10;
  optional string sender_name = 11;
}

// The platform reported that an existing message's content changed. The
// connector reports the original message's native id and the new text; the core
// resolves it to the logical message and fans the edit out to the other copies.
message MessageEditEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  optional string text = 4;
}

// The platform reported that an existing message was deleted/revoked. The
// connector reports the original message's native id; the core resolves it to
// the logical message and fans the deletion out to the other copies.
message MessageDeleteEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
}

// The platform reported a chat address change (e.g. WhatsApp phone-to-LID).
// Both addresses remain resolvable; the new one becomes canonical for outbound.
message IdentityMigrated {
  string old_chat_id = 1;
  optional string old_thread_id = 2;
  string new_chat_id = 3;
  optional string new_thread_id = 4;
}

message Acknowledgement {
  string dispatch_id = 1;
  string platform_message_id = 2;
  // The thread/topic the message landed in. Set when the dispatch provisioned a
  // new thread, so the core can persist the conversation thread mapping.
  optional string thread_id = 3;
}

// A dispatch that can never succeed (e.g. an invalid target peer). The
// connector reports it instead of acknowledging so the core dead-letters the
// dispatch rather than redelivering it forever. Transient failures are not
// reported this way; the connector drops its session and the core redelivers.
message DispatchFailed {
  string dispatch_id = 1;
  string reason = 2;
}

// The platform reported a reaction change on a message. Reactions are toggles:
// `emoji` empty means the reactor cleared their reaction. The connector reports
// the reacted message's native id (resolved to the logical message like an
// edit), the reactor, and `from_me` so the core can recognize a reaction it
// applied being echoed back. Mirrored reactions render as text, so this has no
// dispatch counterpart in the source-to-mirror direction.
message ReactionEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  string sender = 4;
  optional string sender_name = 5;
  string emoji = 6;
  bool from_me = 7;
}

// Whether a receipt reports the message reached the peer's device (delivered) or
// was opened by the peer (read).
enum ReceiptKind {
  RECEIPT_KIND_UNSPECIFIED = 0;
  RECEIPT_KIND_DELIVERED = 1;
  RECEIPT_KIND_READ = 2;
}

// The platform reported a delivery or read receipt for a message. Surfaced on
// the message's other copies: a 👍 reaction for delivered, a 👀 reaction for
// read (DMs only). This works for messages the bridge sent and for messages the
// account owner sent from another of the platform's devices, since the peer's
// receipt names the message either way. The connector reports the message's
// native id; the core resolves it to the logical message and fans the signal to
// the non-observer endpoints. `observer` is the peer that delivered/read it;
// `from_me` flags the owner's own receipt (e.g. a read on another device), which
// the core ignores.
message ReceiptEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  string observer = 4;
  bool from_me = 5;
  ReceiptKind kind = 6;
}


// How badly a connector's own operation is affected. The core picks the
// wording from this, so a connector reports what happened rather than how it
// should read.
enum NoticeKind {
  NOTICE_KIND_UNSPECIFIED = 0;
  // The platform ended the session; it cannot recover without the owner
  // re-authenticating (a WhatsApp logout, a revoked pairing).
  NOTICE_KIND_LOGGED_OUT = 1;
  // Credentials were rejected or expired, and the connector needs new ones.
  NOTICE_KIND_AUTH_REQUIRED = 2;
  // Still running, but impaired — rate limited, temporarily banned, or
  // otherwise degraded.
  NOTICE_KIND_DEGRADED = 3;
  // Back to normal after one of the above.
  NOTICE_KIND_RECOVERED = 4;
}

// A connector reporting its own operational state to the account owner. A
// connector that loses its session goes quiet, and a bridge that has quietly
// stopped bridging is worse than one that says so: the core turns this into a
// message delivered through the *other* connectors, which are still working.
//
// The connector reports only what happened. Where the notice goes, how it is
// worded, and whether a repeat is worth sending are all core decisions.
message OwnerNotice {
  NoticeKind kind = 1;
  // Platform-supplied specifics, if any (a ban expiry, a failure reason).
  // Appended to the core's wording; safe to leave empty.
  string detail = 2;
}
message ClientFrame {
  oneof body {
    Registration registration = 1;
    MessageCreateEvent message_create = 2;
    Acknowledgement acknowledgement = 3;
    IdentityMigrated identity_migrated = 4;
    DispatchFailed dispatch_failed = 5;
    MessageEditEvent message_edit = 6;
    MessageDeleteEvent message_delete = 7;
    ReactionEvent reaction = 8;
    ReceiptEvent receipt = 9;
    OwnerNotice owner_notice = 10;
  }
}
