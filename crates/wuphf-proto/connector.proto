syntax = "proto3";

package wuphf.connector.v1;

option go_package = "github.com/akshettrj/wuphf/proto/go/connector/v1;wuphfpb";

service ConnectorTransport {
  rpc OpenSession(stream ClientFrame) returns (stream ServerFrame);
}

service MediaTransport {
  rpc UploadMedia(stream UploadMediaFrame) returns (Attachment);
  rpc DownloadMedia(DownloadMediaRequest) returns (stream MediaChunk);
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WHATSAPP = 1;
  PLATFORM_TELEGRAM = 2;
  PLATFORM_DISCORD = 3;
  PLATFORM_SIGNAL = 4;
  PLATFORM_SLACK = 5;
  PLATFORM_MATRIX = 6;
  PLATFORM_INSTAGRAM = 7;
}

message Capabilities {
  bool supports_threads = 1;
  bool supports_topic_create = 2;
}

message Registration {
  string connector_id = 1;
  Platform platform = 2;
  Capabilities capabilities = 3;
}

message Attachment {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_IMAGE = 1;
    KIND_VIDEO = 2;
    KIND_AUDIO = 3;
    KIND_FILE = 4;
    KIND_STICKER = 5;
  }

  string media_id = 1;
  Kind kind = 2;
  optional string file_name = 3;
  optional string mime_type = 4;
  optional uint64 size_bytes = 5;
}

message MediaMetadata {
  Attachment.Kind kind = 1;
  optional string file_name = 2;
  optional string mime_type = 3;
  optional uint64 size_bytes = 4;
}

message UploadMediaFrame {
  oneof body {
    MediaMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message DownloadMediaRequest {
  string media_id = 1;
}

message MediaChunk {
  bytes chunk = 1;
}

// Raw origin coordinates for an inbound message. The connector id is taken from
// the session registration, not the wire, so a session cannot speak for another
// connector. The core resolves (connector, chat_id, thread_id) to an endpoint.
message MessageCreateEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  optional string chat_title = 3;
  string platform_message_id = 4;
  string sender = 5;
  optional string participant = 6;
  optional string text = 7;
  repeated Attachment attachments = 8;
  optional string reply_to_platform_message_id = 9;
  int64 timestamp_ms = 10;
  optional string sender_name = 11;
}

// The platform reported that an existing message's content changed. The
// connector reports the original message's native id and the new text; the core
// resolves it to the logical message and fans the edit out to the other copies.
message MessageEditEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
  optional string text = 4;
}

// The platform reported that an existing message was deleted/revoked. The
// connector reports the original message's native id; the core resolves it to
// the logical message and fans the deletion out to the other copies.
message MessageDeleteEvent {
  string chat_id = 1;
  optional string thread_id = 2;
  string platform_message_id = 3;
}

// The platform reported a chat address change (e.g. WhatsApp phone-to-LID).
// Both addresses remain resolvable; the new one becomes canonical for outbound.
message IdentityMigrated {
  string old_chat_id = 1;
  optional string old_thread_id = 2;
  string new_chat_id = 3;
  optional string new_thread_id = 4;
}

message ReplyContext {
  string logical_message_id = 1;
  string platform_message_id = 2;
  string sender = 3;
  optional string participant = 4;
  optional string text = 5;
  repeated Attachment attachments = 6;
}

message Acknowledgement {
  string dispatch_id = 1;
  string platform_message_id = 2;
  // The thread/topic the message landed in. Set when the dispatch provisioned a
  // new thread, so the core can persist the conversation thread mapping.
  optional string thread_id = 3;
}

// A dispatch that can never succeed (e.g. an invalid target peer). The
// connector reports it instead of acknowledging so the core dead-letters the
// dispatch rather than redelivering it forever. Transient failures are not
// reported this way; the connector drops its session and the core redelivers.
message DispatchFailed {
  string dispatch_id = 1;
  string reason = 2;
}

message ClientFrame {
  oneof body {
    Registration registration = 1;
    MessageCreateEvent message_create = 2;
    Acknowledgement acknowledgement = 3;
    IdentityMigrated identity_migrated = 4;
    DispatchFailed dispatch_failed = 5;
    MessageEditEvent message_edit = 6;
    MessageDeleteEvent message_delete = 7;
  }
}

// Instruction to create a thread/topic in a container before sending, used when
// a mirror conversation has no thread yet. The connector creates the thread,
// sends, and reports the resulting thread id back in the acknowledgement.
message ProvisionThread {
  string container = 1;
  string title = 2;
}

message MessageCreateDispatch {
  string dispatch_id = 1;
  string target_chat_id = 2;
  optional string target_thread_id = 3;
  optional ProvisionThread provision_thread = 4;
  string sender = 5;
  optional string participant = 6;
  optional string text = 7;
  repeated Attachment attachments = 8;
  optional string reply_to_platform_message_id = 9;
  int64 timestamp_ms = 10;
  optional ReplyContext reply_context = 11;
  optional string sender_name = 12;
}

// How a connector should render a replicated edit, resolved by the server from
// the target connector's delivery options.
enum EditMode {
  EDIT_MODE_IN_PLACE = 0;
  EDIT_MODE_REPOST = 1;
}

// How a connector should render a replicated delete, resolved by the server from
// the target connector's delivery options.
enum DeleteMode {
  DELETE_MODE_REVOKE = 0;
  DELETE_MODE_TOMBSTONE = 1;
}

// Instruction to revise an already-delivered copy. `target_platform_message_id`
// is the native id of the message to edit at this endpoint.
message MessageEditDispatch {
  string dispatch_id = 1;
  string target_chat_id = 2;
  optional string target_thread_id = 3;
  string target_platform_message_id = 4;
  optional string text = 5;
  optional string sender_name = 6;
  optional string participant = 7;
  EditMode edit_mode = 8;
}

// Instruction to revoke an already-delivered copy. `target_platform_message_id`
// is the native id of the message to delete at this endpoint.
message MessageDeleteDispatch {
  string dispatch_id = 1;
  string target_chat_id = 2;
  optional string target_thread_id = 3;
  string target_platform_message_id = 4;
  DeleteMode delete_mode = 5;
}

// Instruction to rename an already-provisioned mirror thread when its source
// conversation's title changes. Addresses the thread by its container and
// thread id; carries no message because a retitle is a conversation property,
// not a per-message operation. Acknowledged like any dispatch.
message MessageRetitleDispatch {
  string dispatch_id = 1;
  string target_chat_id = 2;
  string target_thread_id = 3;
  string title = 4;
}

message Rejected {
  string reason = 1;
}

message ServerFrame {
  oneof body {
    MessageCreateDispatch message_create = 1;
    Rejected rejected = 2;
    MessageEditDispatch message_edit = 3;
    MessageDeleteDispatch message_delete = 4;
    MessageRetitleDispatch message_retitle = 5;
  }
}
