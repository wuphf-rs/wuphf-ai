syntax = "proto3";

package wuphf.connector.v1;

option go_package = "github.com/akshettrj/wuphf/proto/go/connector/v1;wuphfpb";

service ConnectorTransport {
  rpc OpenSession(stream ClientFrame) returns (stream ServerFrame);
}

service MediaTransport {
  rpc UploadMedia(stream UploadMediaFrame) returns (Attachment);
  rpc DownloadMedia(DownloadMediaRequest) returns (stream MediaChunk);
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WHATSAPP = 1;
  PLATFORM_TELEGRAM = 2;
  PLATFORM_DISCORD = 3;
  PLATFORM_SIGNAL = 4;
  PLATFORM_SLACK = 5;
  PLATFORM_MATRIX = 6;
}

message Registration {
  string connector_id = 1;
  Platform platform = 2;
  repeated string endpoint_ids = 3;
}

message Attachment {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_IMAGE = 1;
    KIND_VIDEO = 2;
    KIND_AUDIO = 3;
    KIND_FILE = 4;
    KIND_STICKER = 5;
  }

  string media_id = 1;
  Kind kind = 2;
  optional string file_name = 3;
  optional string mime_type = 4;
  optional uint64 size_bytes = 5;
}

message MediaMetadata {
  Attachment.Kind kind = 1;
  optional string file_name = 2;
  optional string mime_type = 3;
  optional uint64 size_bytes = 4;
}

message UploadMediaFrame {
  oneof body {
    MediaMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message DownloadMediaRequest {
  string media_id = 1;
}

message MediaChunk {
  bytes chunk = 1;
}

message MessageCreateEvent {
  string origin_endpoint_id = 1;
  string group_id = 2;
  string platform_message_id = 3;
  string sender = 4;
  optional string participant = 5;
  optional string text = 6;
  repeated Attachment attachments = 7;
  optional string reply_to_platform_message_id = 8;
  int64 timestamp_ms = 9;
}

message ReplyContext {
  string logical_message_id = 1;
  string platform_message_id = 2;
  string sender = 3;
  optional string participant = 4;
  optional string text = 5;
  repeated Attachment attachments = 6;
}

message Acknowledgement {
  string dispatch_id = 1;
  string platform_message_id = 2;
}

message ClientFrame {
  oneof body {
    Registration registration = 1;
    MessageCreateEvent message_create = 2;
    Acknowledgement acknowledgement = 3;
  }
}

message MessageCreateDispatch {
  string dispatch_id = 1;
  string target_endpoint_id = 2;
  string logical_message_id = 3;
  string group_id = 4;
  string sender = 5;
  optional string participant = 6;
  optional string text = 7;
  repeated Attachment attachments = 8;
  optional string reply_to_logical_message_id = 9;
  optional string reply_to_platform_message_id = 10;
  int64 timestamp_ms = 11;
  optional ReplyContext reply_context = 12;
}

message Rejected {
  string reason = 1;
}

message ServerFrame {
  oneof body {
    MessageCreateDispatch message_create = 1;
    Rejected rejected = 2;
  }
}
