syntax = "proto3";

package wuphf.connector.v1;

option go_package = "github.com/akshettrj/wuphf/proto/go/connector/v1;wuphfpb";

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WHATSAPP = 1;
  PLATFORM_TELEGRAM = 2;
  PLATFORM_DISCORD = 3;
  PLATFORM_SIGNAL = 4;
  PLATFORM_SLACK = 5;
  PLATFORM_MATRIX = 6;
  PLATFORM_INSTAGRAM = 7;
}

message Capabilities {
  bool supports_threads = 1;
  bool supports_topic_create = 2;
  // The connector stamps a chat's disappearing-messages timer on what it
  // sends, and reports the timers it observes. The core fills
  // MessageCreateDispatch.disappearing only for connectors that declare it.
  bool supports_disappearing_timers = 3;
}

// A chat's disappearing-messages timer, a platform-neutral chat property.
// `seconds` 0 means off. `setting_timestamp` is when the timer was set, in
// Unix seconds, when the platform says; the core keeps the newer of two
// timestamped reports, and otherwise the later one.
message DisappearingTimer {
  uint32 seconds = 1;
  optional int64 setting_timestamp = 2;
}

message Registration {
  string connector_id = 1;
  Platform platform = 2;
  Capabilities capabilities = 3;
  // The connector's runtime settings, which the core stores, validates and
  // pushes back through its botconf.v1.Settings service. Absent means the
  // connector declares none; a section declared earlier is kept.
  optional ConnectorSettingsDeclaration settings = 4;
}

// What a connector declares about its runtime settings at registration.
message ConnectorSettingsDeclaration {
  // A botconf.v1.DescribeResponse serialized with protobuf, listing only the
  // settings (`sections` is ignored). Keys are relative to the connector's
  // section, e.g. `rendering.edit_mode`. Carried as bytes so this proto does
  // not import botconf's.
  bytes descriptor = 1;
  // A JSON Schema (draft 2020-12) of the whole section.
  string json_schema = 2;
  // The connector's own file values for the section, as a JSON object: the
  // base the core's stored overrides are layered on.
  string base_json = 3;
}

message Attachment {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_IMAGE = 1;
    KIND_VIDEO = 2;
    KIND_AUDIO = 3;
    KIND_FILE = 4;
    KIND_STICKER = 5;
  }

  string media_id = 1;
  Kind kind = 2;
  optional string file_name = 3;
  optional string mime_type = 4;
  optional uint64 size_bytes = 5;
  // Whether the media plays: an animated sticker (animated WebP, WebM/.tgs
  // sticker) or a GIF (KIND_VIDEO with GIF playback semantics). Lets a target
  // render motion natively — e.g. a WhatsApp animated sticker becomes a Telegram
  // WebM video sticker rather than a still frame — since the mime type alone
  // cannot distinguish a static from an animated WebP, or a GIF from a video.
  bool animated = 6;
}

message MediaMetadata {
  Attachment.Kind kind = 1;
  optional string file_name = 2;
  optional string mime_type = 3;
  optional uint64 size_bytes = 4;
  bool animated = 5;
}
