[package]
name = "wuphf-connector"
description = "Shared connector session client for the wuphf core (Rust equivalent of the Go coreclient)"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# `settings::settings_of`: a section's settings from its botconf description.
describe = ["dep:botconf"]

[dependencies]
anyhow.workspace = true
botconf = { workspace = true, optional = true }
botconf-proto.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wuphf-proto.workspace = true

[dev-dependencies]
botconf = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["net"] }
wuphf-core.workspace = true
wuphf-model.workspace = true
wuphf-runtime.workspace = true
wuphf-storage.workspace = true
