[workspace]
members = [
  "crates/wuphf-model",
  "crates/wuphf-proto",
  "crates/wuphf-functions",
  "crates/wuphf-settings",
  "crates/wuphf-storage",
  "crates/wuphf-core",
  "crates/wuphf-runtime",
  "crates/wuphf-cli",
  "crates/wuphf-tui",
  "crates/wuphf-connector",
]
# The whatsapp-rust connector is its own workspace (like the Go connectors are
# separate Go modules): its session store links libsqlite3-sys 0.37 via diesel,
# which cannot coexist in one dependency graph with the 0.28 that sqlx links
# for wuphf-storage.
exclude = ["connectors/whatsapp-rust"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
botconf = { git = "https://github.com/propheci/botconf", tag = "v0.10.0" }
botconf-grpc = { git = "https://github.com/propheci/botconf", tag = "v0.10.0" }
botconf-panel = { git = "https://github.com/propheci/botconf", tag = "v0.10.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
figment = { version = "0.10", features = ["env", "toml"] }
# Validates connector settings sections against the JSON Schema each
# connector declares. No default features: schemas are inline, never fetched.
jsonschema = { version = "0.60", default-features = false }
ratatui = "0.29"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
wuphf-connector = { path = "crates/wuphf-connector" }
wuphf-core = { path = "crates/wuphf-core" }
wuphf-functions = { path = "crates/wuphf-functions" }
wuphf-model = { path = "crates/wuphf-model" }
wuphf-proto = { path = "crates/wuphf-proto" }
wuphf-runtime = { path = "crates/wuphf-runtime" }
wuphf-settings = { path = "crates/wuphf-settings" }
wuphf-storage = { path = "crates/wuphf-storage" }
