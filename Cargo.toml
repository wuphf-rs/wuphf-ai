[workspace]
members = [
  "crates/wuphf-model",
  "crates/wuphf-proto",
  "crates/wuphf-storage",
  "crates/wuphf-router",
  "crates/wuphf-core",
  "crates/wuphf-runtime",
  "crates/wuphf-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
wuphf-core = { path = "crates/wuphf-core" }
wuphf-model = { path = "crates/wuphf-model" }
wuphf-proto = { path = "crates/wuphf-proto" }
wuphf-router = { path = "crates/wuphf-router" }
wuphf-runtime = { path = "crates/wuphf-runtime" }
wuphf-storage = { path = "crates/wuphf-storage" }
