# wuphf Telegram connector
#
# Runtime settings (log_level, media_convert_timeout_ms, [rendering]) can also
# change while the connector runs: the connector declares them to the core,
# which keeps any change (made from its settings panel or `wuphf-server
# settings`, under `connector_settings.<connector id>`) and pushes it back here.
# The values in this file are the base; unsetting a change returns to them.
#
# The Telegram application credentials are read from the environment (setup sets
# them on its Environment screen): WUPHF_TELEGRAM_APP_ID and
# WUPHF_TELEGRAM_APP_HASH, and for a user session WUPHF_TELEGRAM_PHONE and
# optionally WUPHF_TELEGRAM_PASSWORD (setup's Link account logs in).
#
# Routing is owned entirely by the core: configure [rules.<id>] entries there,
# using typed chat ids such as telegram:channel:1234567890, telegram:chat:7 or
# telegram:user:88.

# The core's gRPC address.
# Required.
core_address = "127.0.0.1:50051"

# Must match a [[connectors]] entry in the core's configuration.
# Required.
connector_id = "telegram-main"

# Environment variable holding this connector's core token; must match the
# core's [[connectors]].token_env for this connector id.
# Required.
core_token_env = "WUPHF_CONNECTOR_TELEGRAM_MAIN_TOKEN"

# Where the Telegram session is kept. Reusing it restores the logged-in session.
# Required.
session_file = "./telegram.session.json"

# Telegram supports forum topics, so the core may use this connector as a
# threaded mirror. Must match the core's [[connectors]] entry.
supports_threads = true

# The core may provision one topic per source conversation (needs
# supports_threads). Must match the core's [[connectors]] entry.
supports_topic_create = true

# Environment variable holding the core's invoke token, when the core sets
# [functions] invoke_token_env.
#
# Animated stickers from other platforms (animated WebP) are converted to
# Telegram video stickers by the core's media.convert function, served by the
# providers/mediaconv process. Without it they arrive as static stickers.
# functions_token_env = "WUPHF_INVOKE_TOKEN"

# The @BotFather token, for a bot session. WUPHF_TELEGRAM_BOT_TOKEN wins over
# it. Keep this file private when it holds the token.
#
# A bot session needs two things set up on the bot itself, or the bridge runs
# one-way without any error to show for it: privacy mode off (@BotFather →
# /setprivacy → Disable) or the bot made an admin, or it only receives
# commands, replies and mentions; and admin in the mirror group with "manage
# topics", which provisioning and renaming a topic per conversation requires. A
# bot also cannot open a chat with someone who has not messaged it first, so any
# rule (or core notify target) pointing at telegram:user:... needs that person
# to have started the bot.
# bot_token = ""

# A helper bot's token, for a user session's settings panel.
# WUPHF_TELEGRAM_PANEL_BOT_TOKEN wins over it.
#
# A user session cannot attach buttons to its messages, so it shows the panel
# through a helper bot: create one with @BotFather, turn on inline mode
# (/setinline), set its token here, and set [panel] session_file. Without one
# the panel is sent as text with numbered options. A bot session needs none of
# this. Owners can also send the panel command to the helper bot in a private
# chat from their own account, which gets an ordinary button panel: use that
# when the bridge runs on an account other than yours, and list your own user id
# in the core's owner_ids, not the bridge account's.
# panel_bot_token = ""

# How much the connector logs (WUPHF_LOG_LEVEL wins)
#
# Any case; anything else is refused. Empty means info.
# One of: trace, debug, info, warn, error.
log_level = "info"

# How long converting a sticker may take, waiting for the converter included; 0
# means 20000
#
# This connector delivers in order, so later messages wait behind a conversion.
# media_convert_timeout_ms = 0

# The settings panel, opened with a command (/wuphf by default): the core's
# settings with buttons. The core only obeys the Telegram user ids listed in its
# [[connectors]].owner_ids for this connector; for a user session that is the
# session's own account id. The command is never mirrored, whoever sends it.
# Read once at startup.
[panel]

# The command that opens the panel, without the slash: 1 to 32 lowercase
# letters, digits or underscores.
# Default: "wuphf".
# command = "wuphf"

# Where the helper bot keeps its session (user sessions with panel_bot_token
# only).
# session_file = "./telegram-panel.session.json"

# How replicated copies are rendered on Telegram: this connector's own policy;
# the core dispatches content only.
[rendering]

# Send every attachment as a file, whatever its kind
# attachments_as_files = false

# Longer text is sent as a file; 0 means no limit
#
# Counted in characters; the file is plain text.
# max_message_length = 4096

# in_place revises the copy; repost replies to it with the new text
#
# repost leaves the mirrored copy untouched and posts the revision as a reply
# marked as an edit.
# One of: in_place, repost.
# Default: "in_place".
edit_mode = "in_place"

# revoke deletes the copy; tombstone replies to it with a notice
# One of: revoke, tombstone.
# Default: "revoke".
delete_mode = "revoke"
