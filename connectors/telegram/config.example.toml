core_address = "127.0.0.1:50051"
connector_id = "telegram-main"
session_file = "./telegram.session.json"

# Telegram supports forum topics, so the core may use this connector as a
# threaded mirror and provision one topic per source conversation.
supports_threads = true
supports_topic_create = true

# Telegram application credentials are read from:
# WUPHF_TELEGRAM_APP_ID and WUPHF_TELEGRAM_APP_HASH.
# For a user session also set WUPHF_TELEGRAM_PHONE and optionally
# WUPHF_TELEGRAM_PASSWORD. Authentication codes are prompted on first login.
# Alternatively set WUPHF_TELEGRAM_BOT_TOKEN for a bot session.
#
# A bot session needs two things set up on the bot itself, or the bridge runs
# one-way without any error to show for it:
#
#   * Privacy mode off (@BotFather -> /setprivacy -> Disable), or the bot made an
#     admin. Otherwise it only receives commands, replies and mentions, so
#     messages typed into a mirror topic never reach the core.
#   * Admin in the mirror group with "manage topics", which is what
#     provisioning and renaming a topic per conversation requires.
#
# A bot also cannot open a chat with someone who has not messaged it first, so
# any rule (or core [[notify]] target) pointing at "telegram:user:..." needs
# that person to have started the bot.
#
# Routing is owned entirely by the core. Configure which conversations map
# where through the core's [[rules]] using typed chat IDs such as
# "telegram:channel:1234567890", "telegram:chat:7", or "telegram:user:88".

# Log verbosity: trace, debug, info, warn, error (WUPHF_LOG_LEVEL overrides).
log_level = "info"

# How replicated copies are rendered on Telegram. This connector's own policy;
# the core dispatches content only.
[rendering]
# Send every attachment as a generic file/document instead of its origin kind.
attachments_as_files = false
# Text longer than this many characters is sent as a plain-text file instead of
# an inline message. 0 (or omitted) leaves text unbounded.
# max_message_length = 4096
# "in_place" (default) revises the mirrored copy; "repost" leaves it untouched
# and posts the revision as a reply marked as an edit.
edit_mode = "in_place"
# "revoke" (default) deletes the mirrored copy; "tombstone" leaves it and posts
# a deletion notice replying to it.
delete_mode = "revoke"
