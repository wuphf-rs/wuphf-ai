core_address = "127.0.0.1:50051"
connector_id = "whatsapp-main"
session_database = "file:whatsapp.session.db?_foreign_keys=on"

# WhatsApp has no threads/topics, so leave both capabilities false. The core
# may only use this connector as a single target or an identity source, never
# as a threaded mirror.
supports_threads = false
supports_topic_create = false

# Routing is owned entirely by the core. Configure which conversations map
# where through the core's [[rules]] using WhatsApp JIDs such as
# "12345@s.whatsapp.net" or "12345@g.us" as chat IDs.

# Log verbosity: trace, debug, info, warn, error (WUPHF_LOG_LEVEL overrides).
log_level = "info"

# Which WhatsApp client the session registers as. Both pair as an Android client
# (so WhatsApp delivers view-once media, which it withholds from a web companion);
# they differ only in the account type they match. Use "android" for a personal
# account and "android_business" for a WhatsApp Business (SMB) account. Empty
# defaults to "android". Experimental, and only applied at the next fresh pairing.
client_mode = "android_business"

# Sticker-pack metadata embedded in stickers bridged to WhatsApp, shown in
# WhatsApp's sticker info. Any field left blank falls back to the defaults shown
# here. WhatsApp has no link field for received stickers, so the link is appended
# to the publisher text (visible, not clickable). Requires webpmux (libwebp) on
# PATH; without it stickers still send, just without metadata.
[sticker_metadata]
pack_name = "wuphf"
author_name = "wuphf-ai"
link = "https://github.com/wuphf/wuphf-ai"

# How replicated copies are rendered on WhatsApp. This connector's own policy;
# the core dispatches content only.
[rendering]
# Send every attachment as a generic file/document instead of its origin kind.
attachments_as_files = false
# Text longer than this many characters is sent as a plain-text file instead of
# an inline message. 0 (or omitted) leaves text unbounded.
# max_message_length = 4096
