# wuphf WhatsApp connector
#
# Runtime settings (log_level, media_convert_timeout_ms, [sticker_metadata],
# [rendering]) can also change while the connector runs: the connector declares
# them to the core, which keeps any change (made from its settings panel or
# `wuphf-server settings`, under `connector_settings.<connector id>`) and pushes
# it back here. The values in this file are the base; unsetting a change returns
# to them.
#
# Routing is owned entirely by the core: configure [rules.<id>] entries there,
# using WhatsApp JIDs such as 12345@s.whatsapp.net or 12345@g.us as chat ids.

# The core's gRPC address.
# Required.
core_address = "127.0.0.1:50051"

# Must match a [[connectors]] entry in the core's configuration.
# Required.
connector_id = "whatsapp-main"

# Environment variable holding this connector's core token; must match the
# core's [[connectors]].token_env for this connector id.
# Required.
core_token_env = "WUPHF_CONNECTOR_WHATSAPP_MAIN_TOKEN"

# The SQLite database (a URI) holding the WhatsApp device session. Reusing it
# restores the paired session; after a logout, delete it and restart the
# connector to pair again.
# Required.
session_database = "file:whatsapp.session.db?_foreign_keys=on"

# WhatsApp has no threads: leave false.
# supports_threads = false

# WhatsApp has no threads: leave false.
# supports_topic_create = false

# Stamp each chat's disappearing-messages timer on what the connector sends, so
# contacts do not see "sent from an older version of WhatsApp, will not
# disappear"; look a group's timer up when the core does not know it, and warn
# the owner when a DM's timer is unknown.
#
# Part of the registration, so it must match supports_disappearing_timers in the
# core's [[connectors]] entry for this connector: when only one side sets it,
# the core refuses the connector.
supports_disappearing_timers = true

# Which WhatsApp client the session registers as. Both pair as an Android
# client, so WhatsApp delivers view-once media, which it withholds from a web
# companion; they differ only in the account type they match: android for a
# personal account, android_business for a WhatsApp Business (SMB) account.
#
# Experimental, and applied only at the next fresh pairing: after a change,
# unlink the device on the phone, move the session database aside and pair
# again.
# One of: android, android_business.
# Default: "android".
client_mode = "android_business"

# How the session is linked, at the first start and again by itself after
# WhatsApp logs it out: qr (scan a QR code in WhatsApp → Linked devices →
# Link a device) or pair_code (type an 8-character code after "Link with phone
# number instead"; needs phone_number).
#
# Either way the code is printed in the connector's log and sent to the owner
# through the core's notice chats (the QR code as a picture): the first at once,
# later ones at growing gaps until it is linked. Unset: pair_code when
# phone_number is set, else qr.
# One of: qr, pair_code.
# login_method = "qr"

# The account's number, country code first, digits only (no +): the number a
# pair code is issued for. Required by login_method = "pair_code".
# phone_number = "15551234567"

# Environment variable holding the core's invoke token, when the core sets
# [functions] invoke_token_env.
#
# Animated stickers from other platforms (Telegram video and Lottie stickers)
# are converted to WebP by the core's media.convert provider
# (providers/mediaconv); without one they arrive as files.
# functions_token_env = "WUPHF_INVOKE_TOKEN"

# How much the connector logs (WUPHF_LOG_LEVEL wins)
#
# Any case; anything else is refused. Empty means info.
# One of: trace, debug, info, warn, error.
log_level = "info"

# How long converting a sticker may take, waiting for the converter included; 0
# means 20000
#
# This connector delivers in order, so later messages wait behind a conversion.
# media_convert_timeout_ms = 0

# Sticker-pack metadata embedded in stickers bridged to WhatsApp, shown in
# WhatsApp's sticker info. A field left blank falls back to the default shown.
# WhatsApp has no link field for received stickers, so the link is appended to
# the publisher text (visible, not clickable).
[sticker_metadata]

# The pack name WhatsApp shows for bridged stickers
# pack_name = "wuphf"

# The author WhatsApp shows for bridged stickers
# author_name = "wuphf-ai"

# A link folded into the sticker's publisher
# link = "https://github.com/wuphf/wuphf-ai"

# How replicated copies are rendered on WhatsApp: this connector's own policy;
# the core dispatches content only.
[rendering]

# Send every attachment as a file, whatever its kind
# attachments_as_files = false

# Longer text is sent as a file; 0 means no limit
#
# Counted in characters; the file is plain text.
# max_message_length = 4096
