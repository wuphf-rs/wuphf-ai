# Standalone workspace on purpose (like the Go connectors are separate Go
# modules): whatsapp-rust's session store links libsqlite3-sys 0.37 via diesel,
# which cannot coexist in one dependency graph with the 0.28 that sqlx links
# for wuphf-storage in the main workspace. Path dependencies reach back into
# the main workspace for the shared contract and session client.
[workspace]

[package]
name = "wuphf-connector-whatsapp"
description = "WhatsApp connector for wuphf, built on whatsapp-rust"
edition = "2024"
license = "MIT"
version = "0.1.0"

[dependencies]
anyhow = "1"
# The config file's description (one per option, on the types) and the setup
# screen; the same release the core pins.
botconf = { git = "https://github.com/propheci/botconf", tag = "v0.15.1", features = ["derive"] }
botconf-tui = { git = "https://github.com/propheci/botconf", tag = "v0.15.1" }
clap = { version = "4", features = ["derive"] }
# The contacts table runs on the session store's diesel pool; pinned to the
# version that store links (see src/contacts.rs).
diesel = { version = "=2.3.11", default-features = false, features = ["sqlite"] }
# Only zlib-rs, the backend the lock already has, for the QR PNG.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "5ca80c5c" }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "5ca80c5c" }
wuphf-connector = { path = "../../crates/wuphf-connector", features = ["describe"] }
# The chat directory setup writes (see src/link.rs).
wuphf-model = { path = "../../crates/wuphf-model" }
wuphf-proto = { path = "../../crates/wuphf-proto" }

[dev-dependencies]
# Decodes the shared settings fixture's descriptor (already in the lock, via
# tonic).
prost = "0.13"
