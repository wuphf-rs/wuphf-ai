core_address = "127.0.0.1:50051"

# Must match a [[connectors]] entry in the core config.
connector_id = "whatsapp-rust"

# Environment variable holding this connector's core token; must match the
# core's `[[connectors]].token_env` value for this connector id.
core_token_env = "WUPHF_CONNECTOR_WHATSAPP_RUST_TOKEN"

# Reusing this path restores the paired session. After logout, delete the
# database and restart the connector to pair again.
session_database = "whatsapp-rust.session.db"

# Log verbosity: trace, debug, info, warn, error. WUPHF_LOG_LEVEL overrides.
log_level = "info"

# How the session is linked, at the first start and again by itself after
# WhatsApp logs it out: "qr" (scan a QR code in WhatsApp → Linked devices →
# Link a device) or "pair_code" (type an 8-character code after "Link with
# phone number instead"; needs phone_number). Either way the code is printed
# here and sent to the owner through the core's notice chats (the QR code as a
# picture): the first at once, later ones at growing gaps until it is linked.
# Unset: "pair_code" when phone_number is set, else "qr".
# login_method = "qr"

# The account's number, country code first, digits only (no `+`): the number a
# pair code is issued for.
# phone_number = "15551234567"

# Stamp each chat's disappearing-messages timer on what this connector sends,
# so contacts do not see "sent from an older version of WhatsApp, will not
# disappear". It is part of the registration, so it must match
# `supports_disappearing_timers` in the core's [[connectors]] entry for this
# connector: when only one side sets it, the core refuses the connector.
supports_disappearing_timers = true

# Which WhatsApp client the session registers as. Both pair as an Android client
# (so WhatsApp delivers view-once media, which it withholds from a web companion);
# they differ only in the account type they match. Use "android" (the default)
# for a personal account and "android_business" for a WhatsApp Business (SMB)
# account. Experimental, and only applied at the next fresh pairing: after a
# change, unlink the device on the phone, move the session database aside and
# pair again.
client_mode = "android_business"

# WhatsApp has no threads, so the thread capabilities are hardcoded false.
# Routing is owned entirely by the core: configure [rules.<id>] entries there
# using WhatsApp JIDs such as "12345@s.whatsapp.net" or "12345@g.us" as chat
# IDs.

# Animated stickers from other platforms (Telegram video and Lottie stickers)
# are converted to WebP by the core's media.convert provider
# (providers/mediaconv); without one they arrive as files.
#
# Environment variable holding the core's invoke token, when the core sets
# [functions] invoke_token_env.
# functions_token_env = "WUPHF_INVOKE_TOKEN"
# Bound on one sticker conversion, including waiting for the converter. This
# connector delivers in order, so later messages wait behind it. Read at
# startup.
# media_convert_timeout_ms = 20000

# Sticker-pack metadata embedded in stickers bridged to WhatsApp, shown in
# WhatsApp's sticker info. Any field left blank falls back to the defaults shown
# here. WhatsApp has no link field for received stickers, so the link is appended
# to the publisher text (visible, not clickable). Read at startup.
[sticker_metadata]
pack_name = "wuphf"
author_name = "wuphf-ai"
link = "https://github.com/wuphf/wuphf-ai"

# How replicated copies are rendered on WhatsApp. This connector's own policy;
# the core dispatches content only. Read at startup: restart after a change.
[rendering]
# Send every attachment as a generic file/document instead of its origin kind.
attachments_as_files = false
# Text longer than this many characters is sent as a plain-text file instead of
# an inline message. 0 (or omitted) leaves text unbounded.
# max_message_length = 4096
