# wuphf core
#
# Every key can be overridden by an environment variable: `WUPHF_CORE_` plus the
# key path in upper case, with `__` between levels (`WUPHF_CORE_LISTEN`,
# `WUPHF_CORE_FUNCTIONS__MAX_DEADLINE_MS`).
#
# A chat is written as one string, `connector:chat`, optionally `#thread`
# (`telegram-main:telegram:channel:2060340733#12`). The connector is everything
# before the first `:`, so chat ids may contain `:`. Inside the chat and the
# thread, write `#` as `%23` and `%` as `%25`. Connector ids may not contain
# `:`, `#`, `%` or spaces.
#
# Runtime settings (`notify`, `receive_only`, `mirror_deletes_kept`, `rules`,
# `chat_state`, `stories`) can also be changed while the core runs, from a
# settings panel or `wuphf-server settings`: stored overrides win over this
# file, and unsetting one goes back to it.

# The address the core's gRPC services listen on (connectors, providers, the
# observer, the settings service).
# Required.
listen = "127.0.0.1:50051"

# The SQLite database holding messages, media and the runtime settings'
# overrides.
# Required.
database_url = "sqlite://wuphf.sqlite"

# The largest media file the core accepts, in bytes.
# Default: 33554432.
# max_media_bytes = 33554432

# How long media no message refers to is kept, in seconds.
# Default: 86400.
# orphan_media_retention_seconds = 86400

# Token the observer service (the TUI read surface) requires as `authorization:
# Bearer <token>`.
#
# Leave it unset only when `listen` is bound to a local address: without it the
# observer, which can read every captured chat, is unauthenticated.
# observer_token = ""

# Chats that receive notices about connector trouble.
#
# A connector that loses its session stops bridging silently (from the outside
# that looks exactly like nobody writing to you), so it tells the core, which
# relays a message here. A notice is never sent through the connector that
# raised it: a logged-out WhatsApp cannot deliver the news that it is logged
# out. List a target on each platform you want to stay reachable on, and leave
# this out to keep notices in the log only.
# Default: [].
notify = ["telegram-main:telegram:user:704338780"]

# Chats nothing is sent into from their mirror topic (plan 083), on top of the
# ones the connectors report as receive-only (WhatsApp: Status, channels you
# don't own or admin, admin-only groups where you're not admin). Name the source
# chat or its mirror topic. A message or edit typed in the mirror is refused
# with a note; reactions still go.
# Default: [].
receive_only = ["whatsapp-main:120363000000000000@g.us"]

# Source connectors whose chats keep a message when you delete its copy in a
# mirror (plan 083). By default deleting your own message's mirror copy deletes
# it on the source too (a story included).
# Default: [].
mirror_deletes_kept = ["whatsapp-main"]

# The connectors the core accepts.
#
# Connectors are thin pipes. The core only trusts a session that presents the
# connector's token (`authorization: Bearer <token>`, read from the environment
# variable named by `token_env`) and whose registration matches an entry here.
# The core refuses to start while a connector's variable is unset or empty: list
# a connector only when you run it. A second session for a connector whose
# session is still live is refused (ALREADY_EXISTS); the connector keeps
# retrying and gets in once the old session has ended. Media upload and download
# accept any connector's or function provider's token.
#
# How a connector renders replicated copies (attachments as files, text
# spillover, edit and delete rendering) is configured in each connector's own
# config file under `[rendering]`, not here.
[[connectors]]

# The connector's id, as its own config names it (`connector_id`).
# Required.
id = "whatsapp-main"

# `whatsapp`, `telegram`, `instagram`, `discord`, `signal`, `slack`, `matrix`,
# or `other:<name>`.
# Required.
platform = "whatsapp"

# Environment variable holding this connector's token. The connector presents it
# as `authorization: Bearer <token>`; its own config names the same variable
# (`core_token_env`).
# Required.
token_env = "WUPHF_CONNECTOR_WHATSAPP_MAIN_TOKEN"

# The connector can post into threads (topics). A many-to-one destination needs
# it and `supports_topic_create`.
# Default: false.
# supports_threads = false

# The connector can create threads (topics).
# Default: false.
# supports_topic_create = false

# The core stamps a chat's disappearing-messages timer on sends to this
# connector and the connector reports the timers it observes. Part of the
# registration, so it must match the connector's own config.
# Default: false.
supports_disappearing_timers = true

# Platform user ids of the owner on this connector, as the connector reports
# actors (e.g. "704338780" for a Telegram user). Settings requests a connector
# makes on behalf of anyone else are refused. File-only: never a runtime
# setting, since it decides who may change the others.
# Default: [].
# owner_ids = []
[[connectors]]

# The connector's id, as its own config names it (`connector_id`).
# Required.
id = "instagram-main"

# `whatsapp`, `telegram`, `instagram`, `discord`, `signal`, `slack`, `matrix`,
# or `other:<name>`.
# Required.
platform = "instagram"

# Environment variable holding this connector's token. The connector presents it
# as `authorization: Bearer <token>`; its own config names the same variable
# (`core_token_env`).
# Required.
token_env = "WUPHF_CONNECTOR_INSTAGRAM_MAIN_TOKEN"

# The connector can post into threads (topics). A many-to-one destination needs
# it and `supports_topic_create`.
# Default: false.
# supports_threads = false

# The connector can create threads (topics).
# Default: false.
# supports_topic_create = false

# The core stamps a chat's disappearing-messages timer on sends to this
# connector and the connector reports the timers it observes. Part of the
# registration, so it must match the connector's own config.
# Default: false.
# supports_disappearing_timers = false

# Platform user ids of the owner on this connector, as the connector reports
# actors (e.g. "704338780" for a Telegram user). Settings requests a connector
# makes on behalf of anyone else are refused. File-only: never a runtime
# setting, since it decides who may change the others.
# Default: [].
# owner_ids = []
[[connectors]]

# The connector's id, as its own config names it (`connector_id`).
# Required.
id = "telegram-main"

# `whatsapp`, `telegram`, `instagram`, `discord`, `signal`, `slack`, `matrix`,
# or `other:<name>`.
# Required.
platform = "telegram"

# Environment variable holding this connector's token. The connector presents it
# as `authorization: Bearer <token>`; its own config names the same variable
# (`core_token_env`).
# Required.
token_env = "WUPHF_CONNECTOR_TELEGRAM_MAIN_TOKEN"

# The connector can post into threads (topics). A many-to-one destination needs
# it and `supports_topic_create`.
# Default: false.
supports_threads = true

# The connector can create threads (topics).
# Default: false.
supports_topic_create = true

# The core stamps a chat's disappearing-messages timer on sends to this
# connector and the connector reports the timers it observes. Part of the
# registration, so it must match the connector's own config.
# Default: false.
# supports_disappearing_timers = false

# Platform user ids of the owner on this connector, as the connector reports
# actors (e.g. "704338780" for a Telegram user). Settings requests a connector
# makes on behalf of anyone else are refused. File-only: never a runtime
# setting, since it decides who may change the others.
# Default: [].
# owner_ids = []

# Routing rules by id: which chats mirror each other. Lower priority numbers
# match first.
#
# Each rule is its own runtime entry (`rules.<id>`). A rule's id is how its
# conversations remember it: renaming a rule (changing its key) starts new
# mirror threads.
#
# Rules declare a flow between a source and a destination. The source end owns
# conversation identity; replication itself is two-way. When several rules match
# the same chat, the one with the lowest `priority` (default 0) wins, then the
# lowest id. Set it only when rules overlap, e.g. `priority = -1` on a
# one-to-one exception to a many-to-one catch-all.
#
# Chat ids may be written in any address form the platform uses for the chat.
# WhatsApp reaches a contact as both a phone JID (`<number>@s.whatsapp.net`) and
# a hidden LID (`<number>@lid`), and delivers messages under either; a list
# entry written with one form selects (or, in a blocklist, excludes) the chat
# under all of them, as soon as the connector has reported that the forms belong
# together. Group ids (`<id>@g.us`) have a single form.
[rules.ig-to-telegram-mirror]
kind = "many-to-one"

# Lower numbers are tried first when several rules match the same chat; ties go
# by id. Only needed when rules overlap.
# Default: 0.
# priority = 0

# The connector whose chats are mirrored.
# Required.
source_connector = "instagram-main"

# A chat, written `connector:chat`, optionally `#thread`.
# Required.
destination = "telegram-main:telegram:channel:2060340733"

# Only these source chats are mirrored. Excludes `except_chats`.
# only_chats = []

# Every source chat except these is mirrored. Excludes `only_chats`.
# except_chats = []
[rules.wa-to-telegram-mirror]
kind = "many-to-one"

# Lower numbers are tried first when several rules match the same chat; ties go
# by id. Only needed when rules overlap.
# Default: 0.
# priority = 0

# The connector whose chats are mirrored.
# Required.
source_connector = "whatsapp-main"

# A chat, written `connector:chat`, optionally `#thread`.
# Required.
destination = "telegram-main:telegram:channel:2060340733"

# Only these source chats are mirrored. Excludes `except_chats`.
# only_chats = []

# Every source chat except these is mirrored. Excludes `only_chats`.
# except_chats = []

# Pin, mute and archive sync between a source chat and its mirror topic
# (Telegram: a pinned topic, the topic's notifications, a closed topic). Muting
# a topic needs a Telegram user session (a bot's notify settings mean nothing).
[chat_state]

# Which way pinning crosses between a chat and its mirror topic.
# One of: off, to_mirror, to_source, both.
# Default: "both".
# pin = "both"

# Which way muting crosses between a chat and its mirror topic.
# One of: off, to_mirror, to_source, both.
# Default: "both".
# mute = "both"

# Which way archiving (closing the topic) crosses between a chat and its mirror
# topic.
# One of: off, to_mirror, to_source, both.
# Default: "both".
# archive = "both"

# Per-conversation overrides of chat_state; the chat is the source chat or its
# mirror topic.
#
# An override's name is free (`[chat_state.chats.family]`); it cannot be the
# chat id, which may contain `.`. An absent state takes the global value.
# [chat_state.chats.<name>]

# Stories (WhatsApp Status): which are mirrored, and whether their mirror copies
# are deleted when they expire.
[stories]

# Mirror stories at all. Off, nobody's story is mirrored (stories already
# mirrored stay).
# Default: true.
# mirror = true

# People whose stories are not mirrored: their direct chat. A muted story is
# dropped, not stored: unmuting brings back none.
# Default: [].
muted = ["whatsapp-main:15550001111@s.whatsapp.net"]

# Delete the mirror copies of a story 24 hours after it was posted, as WhatsApp
# does. Off, the mirror keeps them.
# Default: false.
# expire_copies = false

# Remote functions (see docs/connector-protocol.md, "Remote functions").
# Providers dial the core and serve named functions; connectors call them. A
# call to a name no provider below may serve fails at once; a call to a servable
# name waits for a provider until its deadline. All durations are milliseconds.
[functions]

# Deadline for a call whose caller sets none.
# Default: 30000.
# default_deadline_ms = 30000

# Cap on any call's deadline, including the caller's own.
# Default: 60000.
# max_deadline_ms = 60000

# HTTP/2 keepalive ping interval, server-wide.
# Default: 10000.
# keepalive_interval_ms = 10000

# How long a keepalive ping may go unanswered before the peer is dropped.
# Default: 20000.
# keepalive_timeout_ms = 20000

# Cap on a call's JSON args and a provider's JSON result.
# Default: 1048576.
# max_body_bytes = 1048576

# Calls that may wait for a provider, per function name and major.
# Default: 256.
# max_queued_calls = 256

# Environment variable holding the shared token callers present to
# FunctionTransport (connectors: their `functions_token_env`). Unset: no token
# is asked for.
# invoke_token_env = "WUPHF_INVOKE_TOKEN"

# The provider processes, and which function names each may serve.
#
# The sticker converter is one: configure it from
# providers/mediaconv/config.example.toml. The Instagram connector can serve
# `instagram.fetch_media@1` (wuphf-misc uses it): enable its `[functions]`
# section with the same id and token variable, and list it here (`id =
# "instagram-main"`, `token_env = "WUPHF_PROVIDER_INSTAGRAM_TOKEN"`, `functions
# = ["instagram.fetch_media"]`).
[[functions.providers]]

# The id the provider registers with.
# Required.
id = "mediaconv"

# Environment variable holding this provider's token (the provider's own config
# names the same variable).
# Required.
token_env = "WUPHF_PROVIDER_MEDIACONV_TOKEN"

# Names this provider may register: exact names, `prefix.*`, or `*`.
# Required.
functions = ["media.convert"]

# Limits for one function name (every major), replacing the global ones:
# `[functions.overrides."media.convert"]`.
# [functions.overrides.<name>]

# Updates: `wuphf-server update` replaces every installed binary with its latest
# release, and `serve` checks for new releases and tells the owner.
#
# wuphf's own binaries come from wuphf's releases (`[updates.wuphf]`); binaries
# built elsewhere (your own `wuphf-misc`, a connector of your own) come from
# their own (`[[updates.sources]]`). Every download is checked against its
# release's SHA256SUMS, signed with minisign.
[updates]

# How often `serve` checks for new releases, in seconds; `0` never checks. Each
# new release is told to the owner once, through the notice chats (`notify`);
# the check never installs anything.
# Default: 86400.
# check_interval_seconds = 86400

# The directory the binaries are installed in. Unset: the directory of the
# running `wuphf-server`.
# install_dir = ""

# Where `wuphf-server update` keeps the binaries it replaced (for `--rollback`),
# its source checkouts and its lock.
# Default: "/var/lib/wuphf/update".
# state_dir = "/var/lib/wuphf/update"

# Pre-releases (`v1.2.0-rc.1`) count as updates.
# Default: false.
# prerelease = false

# wuphf's own binaries.
[updates.wuphf]

# Update wuphf's own binaries. Off: only `sources` are updated and checked.
# Default: true.
# enabled = true

# `release` installs the release's downloads; `source` builds the release's tag
# (needs git, cargo, go and a C toolchain on this host).
# One of: release, source.
# Default: "release".
# from = "release"

# The repository: wuphf's own, or a fork publishing releases the same way (set
# `public_key` to the fork's key).
# Default: "https://github.com/wuphf-rs/wuphf-ai".
# repository = "https://github.com/wuphf-rs/wuphf-ai"

# The minisign public key the release's SHA256SUMS is signed with: the `.pub`
# file, or its key line. Unset: wuphf's own release key.
# public_key = ""

# Environment variable holding a token for the repository's API, for a private
# fork or past GitHub's 60 unauthenticated requests an hour.
# token_env = ""

# Other release sources, each providing some binaries. A binary a source lists
# is updated from that source only, never from wuphf's releases: list your own
# `wuphf-misc` here to keep it.
# [[updates.sources]]
