#                       thread_id = "12"

# Every WhatsApp chat (the identity source) fanned into one Telegram supergroup,
# with one topic auto-created per source conversation. `include`/`exclude` are
# explicit chat-id lists; an empty `include` means "all chats".
[[rules]]
id = "wa-to-telegram-mirror"

[[rules.sides]]
connector = "whatsapp-main"
kind = "source"
exclude = []

[[rules.sides]]
connector = "telegram-main"
kind = "mirror"
container = "telegram:channel:2060340733"

[[rules]]
id = "ig-to-telegram-mirror"

[[rules.sides]]
connector = "instagram-main"
kind = "source"
exclude = []

[[rules.sides]]
connector = "telegram-main"
kind = "mirror"
container = "telegram:channel:2060340733"
