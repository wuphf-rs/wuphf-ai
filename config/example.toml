# Every key can be overridden by an environment variable: `WUPHF_CORE_` plus the
# key path in upper case, with `__` between levels (`WUPHF_CORE_LISTEN`,
# `WUPHF_CORE_FUNCTIONS__MAX_DEADLINE_MS`).
#
# A chat is written as one string, `connector:chat`, optionally `#thread`
# (`telegram-main:telegram:channel:2060340733#12`). The connector is everything
# before the first `:`, so chat ids may contain `:`. Inside the chat and the
# thread, write `#` as `%23` and `%` as `%25`. Connector ids may not contain
# `:`, `#`, `%` or spaces.

listen = "127.0.0.1:50051"
database_url = "sqlite://wuphf.sqlite"
max_media_bytes = 33554432
orphan_media_retention_seconds = 86400

# Token the observer service (the TUI read surface) requires as
# `authorization: Bearer <token>`. Leave unset only when `listen` is bound to a
# local address — without it the observer, which can read every captured chat,
# is unauthenticated.
# observer_token = "change-me"

# Where connectors report their own trouble. A connector that loses its session
# stops bridging silently — from the outside that looks exactly like nobody
# writing to you — so it tells the core, which relays a message here.
#
# A notice is never sent through the connector that raised it: a logged-out
# WhatsApp cannot deliver the news that it is logged out. List a target on each
# platform you want to stay reachable on, and leave this out entirely to keep
# notices in the log only.
#
# Runtime setting: can also be changed while the core runs (stored overrides win
# over this file; unsetting one goes back to this file). It is a top-level key,
# so it must stay above the first `[table]`.
notify = ["telegram-main:telegram:user:704338780"]

# Connectors are thin pipes. The core only trusts a session that presents the
# connector's token (`authorization: Bearer <token>`, read from the environment
# variable named by `token_env`) *and* whose registration matches an entry here.
# The core refuses to start while a connector's variable is unset or empty. A
# second session for a connector whose session is still live is refused
# (ALREADY_EXISTS); the connector keeps retrying and gets in once the old
# session has ended. Media upload and download accept any connector's or
# function provider's token.
#
# `supports_threads` / `supports_topic_create` gate which rule ends a connector
# may serve (a many-to-one destination needs both). How a connector renders
# replicated copies (attachments-as-files, text spillover, edit/delete
# rendering) is configured in each connector's own config file under
# `[rendering]`, not here.
#
# `supports_disappearing_timers` lets the core stamp a chat's
# disappearing-messages timer on sends to this connector (WhatsApp). It is part
# of the connector's registration, so it must match the connector's own config:
# when only one side sets it, the core refuses the connector.
#
# `owner_ids` lists the owner's platform user ids on a connector, as that
# connector reports who acted. The core's settings service only obeys a
# connector acting for one of its own owner ids (or the observer token), so
# these decide who may change settings from that platform. File-only: never
# editable at runtime.
[[connectors]]
id = "whatsapp-main"
platform = "whatsapp"
token_env = "WUPHF_CONNECTOR_WHATSAPP_MAIN_TOKEN"
supports_disappearing_timers = true
# owner_ids = ["98765432101234@lid"]

# Rust WhatsApp connector, an alternative to whatsapp-main. Uncomment it only
# when you run it: the core refuses to start while any listed connector's token
# variable is unset. Keep its id in sync with
# connectors/whatsapp-rust/config.example.toml.
# [[connectors]]
# id = "whatsapp-rust"
# platform = "whatsapp"
# token_env = "WUPHF_CONNECTOR_WHATSAPP_RUST_TOKEN"
# supports_disappearing_timers = true

[[connectors]]
id = "instagram-main"
platform = "instagram"
token_env = "WUPHF_CONNECTOR_INSTAGRAM_MAIN_TOKEN"

[[connectors]]
id = "telegram-main"
platform = "telegram"
token_env = "WUPHF_CONNECTOR_TELEGRAM_MAIN_TOKEN"
supports_threads = true
supports_topic_create = true
# owner_ids = ["704338780"]

# Rules, keyed by id: `[rules.<id>]`. Runtime setting: each rule is its own
# entry (`rules.<id>`) and can be set or removed while the core runs (stored
# overrides win over this file; unsetting goes back to it).
#
# A rule's id is how its conversations remember it: renaming a rule (changing
# its key) starts new mirror threads.
#
# Rules declare a flow between a source and a destination. The source end owns
# conversation identity; replication itself is two-way.
#
# `kind = "one-to-one"`: one fixed source chat mirrored into one fixed
# destination chat (optionally a thread within it):
#
# [rules.direct-pair]
# kind = "one-to-one"
# source = "whatsapp-main:12345@s.whatsapp.net"
# destination = "telegram-main:telegram:channel:2060340733#12"
#
# `kind = "many-to-one"`: every chat on the source connector, each mirrored
# into its own topic auto-created inside the destination container chat. A
# many-to-one rule may limit its source chats with `only_chats = [...]` (an
# allowlist) or `except_chats = [...]` (a blocklist), not both; the chats must
# be on `source_connector`:
#
# except_chats = ["whatsapp-main:12345@s.whatsapp.net"]
#
# When several rules match the same chat, the one with the lowest `priority`
# (default 0) wins, then the lowest id. Set it only when rules overlap, e.g.
# `priority = -1` on a one-to-one exception to a many-to-one catch-all.
#
# Chat ids may be written in any address form the platform uses for the chat.
# WhatsApp reaches a contact as both a phone JID (`<number>@s.whatsapp.net`) and
# a hidden LID (`<number>@lid`), and delivers messages under either; a list
# entry written with one form selects — or, in a blocklist, excludes — the chat
# under all of them, as soon as the connector has reported that the forms belong
# together. Group ids (`<id>@g.us`) have a single form.
[rules.wa-to-telegram-mirror]
kind = "many-to-one"
source_connector = "whatsapp-main"
destination = "telegram-main:telegram:channel:2060340733"

[rules.ig-to-telegram-mirror]
kind = "many-to-one"
source_connector = "instagram-main"
destination = "telegram-main:telegram:channel:2060340733"

# Remote functions (see docs/connector-protocol.md, "Remote functions").
# Providers dial the core and serve named functions; connectors call them.
# A call to a name no provider below may serve fails at once; a call to a
# servable name waits for a provider until its deadline.
# [functions]
# default_deadline_ms = 30000
# max_deadline_ms = 60000
# keepalive_interval_ms = 10000
# keepalive_timeout_ms = 20000
# max_body_bytes = 1048576
# max_queued_calls = 256
# invoke_token_env = "WUPHF_INVOKE_TOKEN"
#
# The sticker converter; configure it from providers/mediaconv/config.example.toml.
[[functions.providers]]
id = "mediaconv"
token_env = "WUPHF_PROVIDER_MEDIACONV_TOKEN"
functions = ["media.convert"]
# [functions.overrides."media.convert"]
# default_deadline_ms = 20000
#
# The Instagram connector can serve instagram.fetch_media@1 (wuphf-misc uses
# it); enable its [functions] section with the same id and token variable.
# [[functions.providers]]
# id = "instagram-main"
# token_env = "WUPHF_PROVIDER_INSTAGRAM_TOKEN"
# functions = ["instagram.fetch_media"]

# Pin, mute and archive sync both ways between a source chat (WhatsApp) and
# its mirror topic (Telegram: a pinned topic, the topic's notifications, a
# closed topic). Each state is `off`, `to_mirror` (source → mirror),
# `to_source` (mirror → source) or `both`; the default is `both`. Muting a
# topic needs a Telegram user session (a bot's notify settings mean nothing).
#
# Runtime settings: `chat_state.pin`, `chat_state.mute`, `chat_state.archive`
# and the overrides below can also be changed while the core runs.
#
# [chat_state]
# pin = "both"
# mute = "both"
# archive = "to_mirror"
#
# An override for one conversation, named by its source chat or its mirror
# topic. Its name is free (it cannot contain '.', which chat ids do); an
# absent state takes the global value.
#
# [chat_state.chats.family]
# chat = "whatsapp-main:120363000000000000@g.us"
# mute = "off"
