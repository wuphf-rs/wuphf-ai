syntax = "proto3";

package wuphf.v1;

// Authenticated connector transport exposed by the core service.
service Connector {
  // Maintains one bidirectional operation and delivery stream per connector.
  rpc ConnectorStream(stream ConnectorToCore) returns (stream CoreToConnector);
}

// Envelope for operations sent from a connector instance to the core.
message ConnectorToCore {
  // Connector action carried by this stream frame.
  oneof operation {
    // Registers and authenticates the stream before all other operations.
    Register register = 1;
    // Submits one newly observed normalized platform message.
    CreateMessage create_message = 2;
    // Acknowledges successful creation of a dispatched target copy.
    DispatchSucceeded dispatch_succeeded = 3;
    // Reports transient or terminal dispatch failure.
    DispatchFailed dispatch_failed = 4;
  }
}

// Envelope for responses and durable commands sent from core to connector.
message CoreToConnector {
  // Core action carried by this stream frame.
  oneof operation {
    // Reports registration acceptance or rejection.
    RegistrationResult registration_result = 1;
    // Requests creation of a target-side message copy.
    DispatchCreateMessage dispatch_create_message = 2;
  }
}

// First connector operation used to authenticate one stream.
message Register {
  // Configured connector instance identity.
  string connector_id = 1;
  // Configured shared authentication token.
  string shared_token = 2;
}

// Result of authenticating a connector stream registration.
message RegistrationResult {
  // Whether connector may use stream for later operations.
  bool accepted = 1;
  // Human-readable registration result detail.
  string message = 2;
}

// Metadata-only description of an attachment associated with a message.
message AttachmentDescriptor {
  // Normalized attachment classification.
  enum Kind {
    // Missing or unclassified attachment kind.
    KIND_UNSPECIFIED = 0;
    // Image attachment descriptor.
    IMAGE = 1;
    // Video attachment descriptor.
    VIDEO = 2;
    // Audio attachment descriptor.
    AUDIO = 3;
    // General file attachment descriptor.
    FILE = 4;
    // Sticker attachment descriptor.
    STICKER = 5;
  }

  // Normalized attachment classification.
  Kind kind = 1;
  // Optional source file name.
  string filename = 2;
  // Optional source MIME type.
  string mime_type = 3;
  // Source-reported byte length metadata.
  uint64 size_bytes = 4;
}

// Normalized platform message observed by a connector at an origin endpoint.
message CreateMessage {
  // Connector-stable observation ID used for ingestion idempotency.
  string event_id = 1;
  // Origin endpoint configured as owned by submitting connector.
  string endpoint_id = 2;
  // Origin-native message identifier.
  string platform_message_id = 3;
  // Origin-native sender identifier.
  string sender_id = 4;
  // Human-readable sender name supplied by connector.
  string sender_display_name = 5;
  // Original send time as Unix milliseconds.
  int64 sent_at_unix_ms = 6;
  // Normalized textual message content.
  string text = 7;
  // Origin-native parent message identifier for replies.
  optional string reply_to_platform_message_id = 8;
  // Metadata descriptors; protocol does not transport media bytes.
  repeated AttachmentDescriptor attachments = 9;
}

// Durable command requesting connector create a message copy at target endpoint.
message DispatchCreateMessage {
  // Durable command identifier used for idempotent outcomes.
  string dispatch_id = 1;
  // Core-owned identity of logical message being replicated.
  string logical_message_id = 2;
  // Target endpoint at which connector must create message copy.
  string endpoint_id = 3;
  // Normalized textual message content.
  string text = 4;
  // Sender identifier retained from logical message.
  string sender_id = 5;
  // Sender display name retained from logical message.
  string sender_display_name = 6;
  // Original message send time as Unix milliseconds.
  int64 sent_at_unix_ms = 7;
  // Target-native parent message identifier once reply dependency is resolved.
  optional string reply_to_platform_message_id = 8;
  // Metadata descriptors; connector owns any future media execution.
  repeated AttachmentDescriptor attachments = 9;
}

// Successful outcome for one durable target dispatch.
message DispatchSucceeded {
  // Durable command being completed.
  string dispatch_id = 1;
  // Platform-native ID created at target endpoint.
  string platform_message_id = 2;
}

// Failed outcome for one durable target dispatch.
message DispatchFailed {
  // Durable command whose attempted delivery failed.
  string dispatch_id = 1;
  // Connector-supplied failure detail for persistence and diagnostics.
  string reason = 2;
  // Defaults to retryable behavior for connectors using the original v1 shape.
  bool permanent = 3;
}
